<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">ai-subscription-usage</title>
  <desc id="svg-desc">Claude Code and Codex session logs flow into a Rust aggregator, producing monthly usage JSON and rate-limit records for an Obsidian dashboard.</desc>
  <style>
    .eyebrow, .title, .tagline, .node-title, .node-sub, .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #534AB7; }
    .title { font-size: 34px; font-weight: 650; fill: #2C2C2A; }
    .tagline { font-size: 14px; fill: #5F5E5A; }
    .node-title { font-size: 12px; font-weight: 650; fill: #2C2C2A; text-anchor: start; }
    .node-sub { font-size: 11px; fill: #5F5E5A; text-anchor: start; }
    .flow-label { font-size: 10px; font-weight: 650; letter-spacing: 1px; fill: #5F5E5A; text-anchor: middle; }
    .gray-fill { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1.5; }
    .teal-fill { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .dashboard-fill { fill: #FFFFFF; stroke: #5F5E5A; stroke-width: 1.2; }
    .connector { fill: none; stroke: #5F5E5A; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .arrowhead { fill: none; stroke: #5F5E5A; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .pipeline-line { fill: none; stroke: #534AB7; stroke-width: 2; stroke-linecap: round; }
    .dashboard-line { fill: none; stroke: #0F6E56; stroke-width: 2; stroke-linecap: round; }
    .dashboard-bar { fill: #0F6E56; }
    @media (prefers-color-scheme: dark) {
      .eyebrow { fill: #AFA9EC; }
      .title, .node-title { fill: #E5E5E2; }
      .tagline, .node-sub { fill: #C7C5BD; }
      .flow-label { fill: #B4B2A9; }
      .gray-fill { fill: #444441; stroke: #B4B2A9; }
      .purple-fill { fill: #3C3489; stroke: #AFA9EC; }
      .teal-fill { fill: #085041; stroke: #5DCAA5; }
      .dashboard-fill { fill: #292927; stroke: #B4B2A9; }
      .connector, .arrowhead { stroke: #B4B2A9; }
      .pipeline-line { stroke: #AFA9EC; }
      .dashboard-line { stroke: #5DCAA5; }
      .dashboard-bar { fill: #5DCAA5; }
    }
  </style>

  <text class="eyebrow" x="52" y="116">RUST CLI · USAGE INTELLIGENCE</text>
  <text class="title" x="50" y="163">ai-subscription-usage</text>
  <text class="tagline" x="52" y="198">Local session logs become subscription insights</text>
  <text class="tagline" x="52" y="220">inside your Obsidian vault.</text>

