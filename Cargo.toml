[package]
name = "ai-subscription-usage"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Aggregate Claude Code and Codex token usage and subscription rate limits into an Obsidian vault"
repository = "https://github.com/akitenkrad/rs-ai-subscription-usage"

[lib]
name = "ai_subscription_usage"
path = "src/lib.rs"

[[bin]]
name = "ai-subscription-usage"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.6.0", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
walkdir = "=2.5.0"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.23.0"
